[package]
name = "ornithochory"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Generic procedural plants for Bevy: trees, shrubs, herbs, grass and moss from one skeleton pipeline"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ChousX/ornithochory"
keywords = ["bevy", "procedural", "vegetation", "trees", "gamedev"]
categories = ["game-development", "rendering"]
exclude = ["/docs", "/live", "/devenv.nix", "/devenv.yaml", "/devenv.lock", "/.envrc", "/clippy.toml", "/.gitignore"]

[features]
# Scatter species over tarasaur terrain chunks as they stream in, and
# re-scatter a chunk when it is edited: `integrate::tarasaur`.
tarasaur = ["dep:tarasaur"]
# Ornisculpt mobs bend the plants they walk through, and ornisculpt's
# `TierCamera` also picks plant tiers: `integrate::ornisculpt`.
ornisculpt = ["dep:ornisculpt"]
# Plants as DNA (`design`): a whole species in one genome, with the traits a
# design lets vary (`lever`), through the `genetics` crate.
genetics = ["dep:genetics"]
# Regrow every plant after `dx serve --hot-patch` swaps in new code, so an
# edit to a grower or mesher shows without a restart (see `live/`).
hotpatching = ["bevy/hotpatching"]

[dependencies]
# Only the parts the library uses; the app's own `bevy` dependency picks the
# platform features. The same set as tarasaur, so the two unify.
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "multi_threaded",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_window",
    "bevy_pbr",
    "bevy_render",
    "bevy_core_pipeline",
    # Vec3 and friends in `*.plant.ron`.
    "serialize",
] }
fastnoise-lite = "1.1"
# The `traits` branch, until it lands on master.
genetics = { git = "https://github.com/ChousX/genetics", branch = "traits", optional = true }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Git `main`, where apps take these crates from too, so an app using them
# together gets one copy of each.
tarasaur = { git = "https://github.com/ChousX/tarasaur", branch = "main", optional = true }
ornisculpt = { git = "https://github.com/ChousX/ornisculpt", branch = "main", optional = true }

[dev-dependencies]
# Seeded mutation in the design tests.
rand = "0.10"
rand_pcg = "0.10"
# Examples open windows and take input, so they need Bevy's default features.
# `file_watcher`: an edited `*.plant.ron` regrows while they run.
bevy = { version = "0.20", features = ["file_watcher"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# Full debuginfo for Bevy made every debug example 2.2 GB, all of it relinked
# on each rebuild. Line tables still give backtraces through it.
debug = "line-tables-only"

# `live`: the grove example as a binary crate of its own. Run as an example,
# `dx serve --hot-patch` patches only the example file, never the library
# beside it (DioxusLabs/dioxus#5778); from its own crate it patches both.
[workspace]
members = ["live"]

[[example]]
name = "terrain"
required-features = ["tarasaur"]

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Bevy system params (Res, Query, Extract, On, ...) must be taken by value.
needless_pass_by_value = "allow"
# Bevy systems take many params and queries name many components.
too_many_arguments = "allow"
type_complexity = "allow"
# DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[package.metadata.docs.rs]
all-features = true
